name: Build and Publish Triton Image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: meta
        run: |
          set -euo pipefail
          REPO=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${REPO}"
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')
          SANITIZED_BRANCH=$(echo "${BRANCH}" | sed -E 's/[^a-z0-9._-]+/-/g')
          SHORT_SHA=$(git rev-parse --short HEAD)

          VERSION_FILE="VERSION"
          BRANCH_VERSION=""
          if [ -f "${VERSION_FILE}" ]; then
            BRANCH_VERSION=$(tr -d '\r' < "${VERSION_FILE}" | tr -d ' \n\t')
          fi

          if [ -n "${BRANCH_VERSION}" ]; then
            SANITIZED_VERSION=$(echo "${BRANCH_VERSION}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          else
            SANITIZED_VERSION=""
          fi

          TAGS=()
          TAGS+=("${IMAGE}:${SANITIZED_BRANCH}")
          TAGS+=("${IMAGE}:${SANITIZED_BRANCH}-${SHORT_SHA}")

          if [ "${SANITIZED_BRANCH}" = "main" ]; then
            TAGS+=("${IMAGE}:latest")
          fi

          if [ -n "${SANITIZED_VERSION}" ]; then
            if [ "${SANITIZED_BRANCH}" = "main" ]; then
              TAGS+=("${IMAGE}:${SANITIZED_VERSION}")
            fi
            TAGS+=("${IMAGE}:${SANITIZED_BRANCH}-${SANITIZED_VERSION}")
          fi

          printf 'tags=%s\n' "$(printf '%s\n' "${TAGS[@]}" | awk '!seen[$0]++' | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Free disk space for Docker build
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ] && [ -d "${AGENT_TOOLSDIRECTORY}" ]; then
            sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          fi
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
